<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d3a" />
      <stop offset="100%" stop-color="#fc8019" />
    </linearGradient>
    <!-- Accent Gradient for details -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe3cb" />
    </linearGradient>
    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <drop-shadow dx="0" dy="10" stdDeviation="8" flood-color="#a84700" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Circle with Gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />

  <!-- Stylized Food Cloche & Speed Lines -->
  <g filter="url(#shadow)">
    <!-- Speed/Delivery Lines (Representing "Go") -->
    <path d="M100 210 H170 M75 255 H145 M105 300 H165" 
          stroke="url(#accentGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          opacity="0.9" />

    <!-- Cloche Dome -->
    <path d="M190 270 C190 170, 390 170, 390 270 Z" 
          fill="url(#accentGrad)" />

    <!-- Cloche Handle -->
    <circle cx="290" cy="160" r="18" fill="url(#accentGrad)" />

    <!-- Cloche Tray/Base -->
    <path d="M165 282 H415 C425 282, 425 298, 415 298 H165 C155 298, 155 282, 165 282 Z" 
          fill="url(#accentGrad)" />
          
    <!-- Steam / Aroma lines -->
    <path d="M245 120 Q255 100 245 85 M290 115 Q300 95 290 80 M335 120 Q345 100 335 85" 
          stroke="url(#accentGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.75" />
  </g>
</svg>
